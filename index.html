<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vocalink</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      width: 60%;
      max-width: 700px;
      background: #1c1c1c;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .textbox {
      width: 100%;
      height: 300px;
      background: #2a2a2a;
      border: none;
      border-radius: 12px;
      padding: 15px;
      color: white;
      font-size: 16px;
      resize: none;
      outline: none;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #6366f1;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="title">Vocalink</div>

  <textarea id="output" class="textbox" placeholder="Translated speech will appear here..."></textarea>

  <button onclick="start()">Start Listening</button>
</div>

<script>
let recognition;
let buffer = "";

function start() {
  recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();

  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = "en-US";

  recognition.onresult = async (event) => {
    let text = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      text += event.results[i][0].transcript;
    }

    buffer += " " + text;

    let words = buffer.trim().split(" ");

    if (words.length >= 8) {
      let chunk = words.slice(0, 8).join(" ");
      buffer = words.slice(8).join(" ");

      const translated = await translate(chunk);

      document.getElementById("output").value += translated + "\n";
    }
  };

  recognition.onerror = (e) => {
    console.log("Speech error:", e.error);
    if (e.error === "no-speech") recognition.start();
  };

  recognition.onend = () => {
    recognition.start();
  };

  recognition.start();
}

// 🌍 Translation function
async function translate(text) {
  const res = await fetch("https://libretranslate.de/translate", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      q: text,
      source: "auto",
      target: "en",
      format: "text"
    })
  });

  const data = await res.json();
  return data.translatedText;
}
</script>

</body>
</html>
