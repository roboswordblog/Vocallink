<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vocalink</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: 60%;
            max-width: 700px;
            background: #1c1c1c;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .textbox {
            width: 100%;
            height: 300px;
            background: #2a2a2a;
            border: none;
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 16px;
            resize: none;
            outline: none;
        }

        .hint {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #aaa;
        }
    </style>

</head>

<body>

<div class="container">
    <div class="title">Vocalink</div>

    <textarea class="output" placeholder="Your translated speech will appear here..."></textarea>

    <div class="hint">Speak → Convert → Translate → Display</div>
</div>
<script src="index.js"></script>
</body>
</html>
